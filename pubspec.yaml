name: mirror_scorpion_v2
description: "Mirror Scorpion Premium - الترجمة الفورية والإلهام"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  flutter_tts: ^4.1.0
  speech_to_text: ^7.4.0
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  intl: ^0.20.2
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  sqflite: ^2.4.1
  camera: ^0.12.0+1
  audioplayers: ^6.8.1
  webview_flutter: ^4.13.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hadiths.json
    - assets/data/hadith_qudsi.json
    - assets/data/quran_stories.json
    - assets/data/stories.json
    - assets/data/asbab_nuzul.json
    - assets/data/arbaeen_nawawi.json
    - assets/data/prophet_stories_ibn_kathir.json
    - assets/images/
