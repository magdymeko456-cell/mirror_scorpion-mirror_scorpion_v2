name: mirror_scorpion_v2
description: Mirror Scorpion - Translation & AI Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: 2.1.1
  path: 1.9.0
  intl: 0.19.0
  provider: 6.1.2
  shared_preferences: 2.3.1
  translator: 1.0.2
  speech_to_text: 6.6.2
  flutter_tts: 4.0.2
  file_picker: 8.1.3
  image_picker: 1.1.2
  open_file: 3.5.3
  url_launcher: 6.3.0
  webview_flutter: 4.10.0
  vector_math: 2.1.4
  flutter_secure_storage: 10.3.1
  share_plus: 10.1.0
  flutter_local_notifications: 18.0.1
  permission_handler: 11.3.1
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/voices/
    - assets/sounds/
    - assets/images/
    - assets/data/
