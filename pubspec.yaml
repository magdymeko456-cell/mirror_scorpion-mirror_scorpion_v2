                    color: voice['name'] == _selectedVoice ? Colors.cyanAccent : Colors.white70,
                  ),
                  title: Text(voice['name']!, style: const TextStyle(color: Colors.white)),
                  subtitle: Text(voice['gender']!, style: const TextStyle(color: Colors.white54)),
