        : lang.currentLanguage;

    return MaterialApp(
      title: 'Mirror Scorpion',
      debugShowCheckedModeBanner: false,
      locale: Locale(localeCode),
      supportedLocales: const [
        Locale('ar'), Locale('en'), Locale('fr'), Locale('de'),
        Locale('es'), Locale('tr'), Locale('fa'), Locale('ur'),
