name: mirror_scorpion_v2
description: "Mirror Scorpion - ترجمة، إلهام، ذكاء اصطناعي، ألعاب"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🎯 إدارة الحالة
  provider: ^6.1.2

  # 🔊 الصوت والكلام
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.4.0
  record: ^6.2.0

  # 🌐 الشبكات والترجمة
  http: ^1.3.0
  google_mlkit_translation: ^0.13.1
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_commons: ^0.9.1

  # 📸 الكاميرا والصورة
  camera: ^0.11.1+1
  image_picker: ^1.1.2

  # 💾 التخزين
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  permission_handler: ^11.4.0

  # 🔗 التفاعل مع النظام
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  flutter_local_notifications: ^19.0.0

  # 🫧 الفقاعة العائمة (بديل خفيف لـ dash_bubble)
  overlay_support: ^2.1.0

  # ♟️ الألعاب 3D
  flutter_3d_controller: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  image_path: "assets/images/scorpion_icon.jpeg"

flutter:
  assets:
    - assets/data/
    - assets/images/
