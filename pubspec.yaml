name: mirror_scorpion_v2
description: Mirror Scorpion v2 - تطبيق الترجمة الذكية والقصص القرآنية
publish_to: 'none'
version: 1.2.0

environment:
  sdk: '>=3.2.0 <3.6.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  http: ^1.6.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.3
  file_picker: ^8.3.7
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  clipboard: ^0.1.3
  permission_handler: ^11.4.0
  sqflite: ^2.4.3
  path_provider: ^2.1.1
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/audio/
