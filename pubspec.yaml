name: mirror_scorpion_translate
description: "Mirror Scorpion - Complete Translation & Inspiration App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  
  # Translation
  http: ^1.2.1
  
  # Text-to-Speech & Speech Recognition
  flutter_tts: ^4.0.2
  speech_to_text: ^7.4.0
  
  # Image & OCR
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.0
  camera: ^0.11.0
  
  # Storage
  shared_preferences: ^2.2.0
  permission_handler: ^11.3.1
  
  # Utilities
  path_provider: ^2.1.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  file_picker: ^6.1.1
  crypto: ^3.0.3
  
  # WebView
  webview_flutter: ^4.7.0
  
  # Audio
  audioplayers: ^6.8.1
  
  # Bubble
  dash_bubble_local:
    path: packages/dash_bubble_local

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hadiths.json
    - assets/data/hadith_qudsi.json
    - assets/data/quran_stories.json
    - assets/data/stories.json
    - assets/images/scorpion_icon.jpeg
