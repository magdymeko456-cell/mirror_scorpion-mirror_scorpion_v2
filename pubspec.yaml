name: mirror_scorpion_v2
description: Mirror Scorpion v2 - تطبيق الترجمة الذكية والقصص القرآنية
publish_to: 'none'
version: 1.2.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.1
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/audio/
