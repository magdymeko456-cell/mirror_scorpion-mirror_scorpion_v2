name: mirror_scorpion_v2
description: "Mirror Scorpion Premium Translation System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  share_plus: ^9.0.0
  clipboard: ^0.1.3
  device_info_plus: ^10.1.0
  
  # منع سحب النسخ المكسورة أثناء الـ Upgrade في السيرفر
  camera: 0.11.0+1
  camera_android_camerax: 0.6.5

dependency_overrides:
  camera_android_camerax: 0.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/scorpion_icon.jpeg
