name: mirror_scorpion_v2
description: "Mirror Scorpion Premium - حيث تُصنع البدايات"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  dash_bubble_local:
    path: packages/dash_bubble_local
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  sqflite: ^2.4.3
  intl: ^0.20.3
  permission_handler: ^13.0.1
  speech_to_text: ^7.4.0
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1
  google_mlkit_text_recognition: ^0.16.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hadiths.json
    - assets/data/hadith_qudsi.json
    - assets/data/quran_stories.json
    - assets/data/stories.json
    - assets/data/asbab_nuzul.json
    - assets/data/arbaeen_nawawi.json
    - assets/data/prophet_stories_ibn_kathir.json
    - assets/images/
