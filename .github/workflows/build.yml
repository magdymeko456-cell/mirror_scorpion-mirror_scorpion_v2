name: 🦂 Build Mirror Scorpion APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          set -e
          flutter pub get

          # Fix speech_to_text in pub cache
          STT_FILE=$(find /home/runner/.pub-cache -path "*/speech_to_text*/android/build.gradle" -type f 2>/dev/null | head -1)
          if [ -n "$STT_FILE" ]; then
            echo "=== Patching $STT_FILE ==="
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 36/' "$STT_FILE"
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion "27.0.12077973"/' "$STT_FILE"
            sed -i '/^kotlin {/,/^}/d' "$STT_FILE"
            echo "=== Done patching speech_to_text ==="
          fi

          flutter build apk --release --no-tree-shake-icons \
            --dart-define=GOOGLE_API_KEY=${{ secrets.API_KEY }}
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-release
          path: output_apk/app-release.apk
          if-no-files-found: error
