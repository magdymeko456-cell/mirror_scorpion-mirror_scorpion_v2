name: Mirror Scorpion Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          # 🟢 استخدام إصدار محدد يعمل (3.22.0 كان مستقراً)
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Test flutter create and build
        run: |
          set -e
          
          rm -rf /tmp/test_project
          flutter create --org com.test --project-name test_app /tmp/test_project
          cd /tmp/test_project
          flutter pub get
          flutter build apk --release
          
          echo "✅ BUILD WORKS!"
