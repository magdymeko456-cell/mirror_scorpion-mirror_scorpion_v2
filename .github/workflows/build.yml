name: Mirror Scorpion Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Prepare Project and Build
        run: |
          set -e
          flutter pub get

          # ===========================================
          # تصحيح speech_to_text-7.4.0 تحديداً
          # المشكلة: compileSdk = flutter.compileSdkVersion
          #          + kotlin { compilerOptions {} } في Groovy
          # الحل: استبدال compileSdk + حذف kotlin block
          # ===========================================
          STT_FILE=$(find ~/.pub-cache -path "*/speech_to_text-*/android/build.gradle" | head -1)
          if [ -n "$STT_FILE" ]; then
            echo "⚡ Patching speech_to_text: $STT_FILE"
            # استبدال compileSdk = flutter.compileSdkVersion بـ compileSdk 36
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 36/g' "$STT_FILE"
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion "27.0.12077973"/g' "$STT_FILE"
            # حذف كتلة kotlin { compilerOptions { ... } } بالكامل
            sed -i '/^kotlin {/,/^}/d' "$STT_FILE"
            echo "✅ speech_to_text build.gradle patched"
          fi

          # ===========================================
          # تصحيح compileSdk لكل مكتبة لا تحدد compileSdk
          # ===========================================
          for f in $(find ~/.pub-cache -name "build.gradle" -path "*/android/*"); do
            if ! grep -q "compileSdk" "$f"; then
              echo "⚡ Adding compileSdk to: $f"
              sed -i 's/apply plugin.*/apply plugin: "com.android.library"\nandroid {\n    compileSdk 36\n}\n/' "$f"
            fi
            # حذف أي kotlin { compilerOptions {} } في Groovy
            sed -i '/^kotlin {/,/^}/d' "$f"
          done 2>/dev/null || true

          for f in $(find ~/.pub-cache -name "build.gradle.kts" -path "*/android/*"); do
            if ! grep -q "compileSdk" "$f"; then
              echo "⚡ Adding compileSdk to: $f"
              sed -i 's/plugins {/plugins {\n    id("com.android.library")/' "$f"
            fi
            # تحديث compileSdk
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$f"
          done 2>/dev/null || true

          # ===========================================
          # إنشاء مشروع نظيف ونسخ الملفات
          # ===========================================
          rm -rf /tmp/clean_project
          flutter create --org com.tetocollctionway --project-name mirror_scorpion_translate /tmp/clean_project

          cp -r lib /tmp/clean_project/
          cp -r assets /tmp/clean_project/
          cp pubspec.yaml /tmp/clean_project/
          cp -r packages /tmp/clean_project/
          cp -r scripts /tmp/clean_project/

          cd /tmp/clean_project
          flutter pub get

          # تشغيل سكربتات التصحيح
          python3 scripts/patch_dash_bubble_compilesdk.py
          python3 scripts/patch_gradle.py
          python3 scripts/patch_manifest.py

          # تصحيح compileSdk/targetSdk في المشروع
          find android -name "build.gradle*" -exec sed -i 's/compileSdk .*/compileSdk = 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdk .*/targetSdk = 35/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/==/=/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/compileSdk=/compileSdk = /g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdk=/targetSdk = /g' {} +

          # بناء
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-release
          path: output_apk/app-release.apk
          if-no-files-found: error
