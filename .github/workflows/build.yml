name: Mirror Scorpion Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Reconstruct Android
        run: |
          set -e
          flutter create --org com.mirror.scorpion --project-name mirror_scorpion_v2 /tmp/clean_p
          rm -rf android
          cp -r /tmp/clean_p/android .

      - name: Copy custom Android config from repo root
        run: |
          set -e
          # نسخ app_build.gradle
          if [ -f app_build.gradle ]; then
            cp -f app_build.gradle android/app/build.gradle
          fi
          # إنشاء مجلدات resources
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/values
          # إنشاء ملفات XML للأيقونات والثيمات
          cat > android/app/src/main/res/mipmap-hdpi/ic_launcher.xml << 'XEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@color/ic_launcher_foreground"/>
        </adaptive-icon>
        XEOF
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.xml android/app/src/main/res/mipmap-mdpi/ic_launcher.xml
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.xml android/app/src/main/res/mipmap-xhdpi/ic_launcher.xml
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.xml android/app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.xml android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml
          # colors.xml
          cat > android/app/src/main/res/values/colors.xml << 'YEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_launcher_background">#1a1a2e</color>
            <color name="ic_launcher_foreground">#e94560</color>
        </resources>
        YEOF
          # styles.xml
          cat > android/app/src/main/res/values/styles.xml << 'ZEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">@color/ic_launcher_background</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">?android:colorBackground</item>
            </style>
        </resources>
        ZEOF
          echo "✅ Resources and icon files created"

      - name: Write gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4G" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Patch Android Manifest
        run: |
          set -e
          sed -i 's|io.flutter.app.FlutterApplication|${applicationName}|g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<application\n <meta-data android:name="flutterEmbedding" android:value="2" />|' android/app/src/main/AndroidManifest.xml
          fi
          find android -name "MainActivity.*" -exec sed -i 's|io.flutter.app.FlutterActivity|io.flutter.embedding.android.FlutterActivity|g' {} +
          echo "✅ Android manifest patched"

      - name: Force Kotlin 1.9.23
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "1.9.23" apply false/' android/settings.gradle
          echo "✅ Kotlin forced to 1.9.23"

      - name: Override build.gradle (root)
        run: |
          cat > android/build.gradle << 'BEOF'
        buildscript {
            ext.kotlin_version = '1.9.23'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        rootProject.buildDir = "../build"
        subprojects {
            project.buildDir = "\${rootProject.buildDir}/\${project.name}"
            project.evaluationDependsOn(":app")
        }
        tasks.register("clean", Delete) { delete rootProject.buildDir }
        BEOF
          echo "✅ Root build.gradle overridden"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-apk
          path: output_apk/app-release.apk
