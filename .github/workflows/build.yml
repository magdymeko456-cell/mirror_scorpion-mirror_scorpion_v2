name: Mirror Scorpion Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Reconstruct Android
        run: |
          set -e
          flutter create --org com.mirror.scorpion --project-name mirror_scorpion_v2 /tmp/clean_p
          rm -rf android
          cp -r /tmp/clean_p/android .
          if [ -f app_build.gradle ]; then
            cp app_build.gradle android/app/build.gradle
          fi

      - name: Write gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4G" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Patch Android
        run: |
          set -e
          # ضمان Android v2 embedding
          sed -i 's|io.flutter.app.FlutterApplication|${applicationName}|g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<application\n <meta-data android:name="flutterEmbedding" android:value="2" />|' android/app/src/main/AndroidManifest.xml
          fi
          find android -name "MainActivity.*" -exec sed -i 's|io.flutter.app.FlutterActivity|io.flutter.embedding.android.FlutterActivity|g' {} +
          echo "✅ Android patched"

      - name: Restore Gradle files from repo
        run: |
          cp android/build.gradle /tmp/clean_p/android/build.gradle
          cp android/app/build.gradle /tmp/clean_p/android/app/build.gradle

      - name: Force Kotlin 1.9.23 in settings.gradle
        run: |
          # الـ flutter create من 3.24.3 يجيب Kotlin 2.x فنرجعها لـ 1.9.23
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "1.9.23" apply false/' android/settings.gradle
          echo "✅ Kotlin forced to 1.9.23"

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean build cache
        run: |
          rm -rf ~/.gradle/caches/8.9/transforms/892b7e2adc96df17f4f973a156ea045b/ 2>/dev/null || true
          rm -rf build/ android/.gradle/ 2>/dev/null || true
          echo "✅ Cache cleaned"

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-apk
          path: output_apk/app-release.apk
