name: Mirror Scorpion Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Prepare Project and Build
        run: |
          set -e
          flutter pub get
          rm -rf /tmp/clean_project
          flutter create --org com.tetocollctionway --project-name mirror_scorpion_translate /tmp/clean_project
          cp -r lib /tmp/clean_project/
          cp -r assets /tmp/clean_project/
          cp pubspec.yaml /tmp/clean_project/
          cp -r packages /tmp/clean_project/
          cp -r scripts /tmp/clean_project/
          cd /tmp/clean_project
          flutter pub get
          python3 scripts/patch_dash_bubble_compilesdk.py || true
          python3 scripts/patch_gradle.py || true
          python3 scripts/patch_manifest.py || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk .*/compileSdk = 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdk .*/targetSdk = 35/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/==/=/g' {} +
          # ✅ تأمين وجود ملفات resources (ic_launcher + themes)
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          # Base64 decoding لإنشاء PNG صغير للأيقونة (48x48 بكسل - رمادي فاتح)
          echo "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAALEwAACxMBAJqcGAAAAFZJREFUaIHt2jEKACAIRFG9/6WtJQiK4kda7IJ9iykAAB/7Ar3NngCAHACAHACYHADAzAEAmDkAADMHAJg5AAAzBwD4r1sBAN4DAABmDgBg5gAAZg78NwEAAP//buFVe90AAPM=" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          # إنشاء styles.xml مع LaunchTheme و NormalTheme
          cat > android/app/src/main/res/values/styles.xml << 'STYLES'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">?android:colorBackground</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">?android:colorBackground</item>
            </style>
        </resources>
        STYLES
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info
          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-release
          path: output_apk/app-release.apk
          if-no-files-found: error
