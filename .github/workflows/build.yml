name: Mirror Scorpion Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          set -e

          # 1. Get dependencies first
          flutter pub get

          # 2. Find the actual pub cache path used by Flutter on this runner
          PUB_CACHE=$(dart pub cache list 2>/dev/null | head -1 || echo "")
          if [ -z "$PUB_CACHE" ]; then
            PUB_CACHE=$(find /opt/hostedtoolcache -name ".pub-cache" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$PUB_CACHE" ]; then
            PUB_CACHE=$(find / -path "*/flutter/*/.pub-cache" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$PUB_CACHE" ]; then
            PUB_CACHE=$(find / -name "pub-cache" -type d 2>/dev/null | head -1)
          fi
          echo "PUB_CACHE=$PUB_CACHE"

          # 3. Find and patch speech_to_text build.gradle
          STT_FILE=$(find / -path "*/speech_to_text*/android/build.gradle" -type f 2>/dev/null | head -1)
          echo "STT_FILE=$STT_FILE"
          
          if [ -n "$STT_FILE" ]; then
            echo "=== Patching $STT_FILE ==="
            cat "$STT_FILE"
            
            # Replace the problematic lines
            # compileSdk = flutter.compileSdkVersion -> compileSdk 36
            # ndkVersion = flutter.ndkVersion -> remove
            # kotlin { compilerOptions { ... } } -> remove block
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 36/' "$STT_FILE"
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion "27.0.12077973"/' "$STT_FILE"
            sed -i '/^kotlin {/,/^}/d' "$STT_FILE"
            
            echo "=== After patching ==="
            cat "$STT_FILE"
          else
            echo "WARNING: speech_to_text build.gradle not found!"
          fi

          # 4. Create clean project and build
          rm -rf /tmp/clean_project
          flutter create --org com.tetocollctionway --project-name mirror_scorpion_translate /tmp/clean_project

          cp -r lib /tmp/clean_project/
          cp -r assets /tmp/clean_project/
          cp pubspec.yaml /tmp/clean_project/
          cp -r packages /tmp/clean_project/
          cp -r scripts /tmp/clean_project/

          cd /tmp/clean_project
          flutter pub get

          # 5. Run patch scripts
          python3 scripts/patch_dash_bubble_compilesdk.py
          python3 scripts/patch_gradle.py
          python3 scripts/patch_manifest.py

          # 6. Fix all compileSdk/targetSdk
          find android -name "build.gradle*" -exec sed -i 's/compileSdk .*/compileSdk = 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdk .*/targetSdk = 35/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/==/=/g' {} +

          # 7. Patch speech_to_text AGAIN in case clean project has different path
          STT_FILE2=$(find / -path "*/speech_to_text*/android/build.gradle" -type f 2>/dev/null | head -1)
          if [ -n "$STT_FILE2" ]; then
            echo "=== Patching (2nd pass) $STT_FILE2 ==="
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 36/' "$STT_FILE2"
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion "27.0.12077973"/' "$STT_FILE2"
            sed -i '/^kotlin {/,/^}/d' "$STT_FILE2"
          fi

          # 8. Build
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-release
          path: output_apk/app-release.apk
          if-no-files-found: error
