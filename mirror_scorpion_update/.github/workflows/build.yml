name: Mirror Scorpion Build  
  
on:  
  push:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
        
      - uses: actions/setup-java@v4  
        with:  
          distribution: 'zulu'  
          java-version: '17'  
            
      - uses: subosito/flutter-action@v2  
        with:  
          channel: 'stable'  
            
      - name: Generate Pristine Android Configuration and Build
        run: |  
          set -e  
          
          flutter pub get  
          
          # توليد المجلد النظيف بالهوية الرسمية (Tamer Eldosoky)
          flutter create . --platforms=android --org com.tamer_eldosoky --project-name mirror_scorpion_translate
          
          # تعديل الجرادل لإلغلاق التام للـ Minify والـ Shrinking ليعود التطبيق لحجمه الكامل المستقر
          find android -name "build.gradle" -type f -exec sed -i 's/minifyEnabled true/minifyEnabled false/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -type f -exec sed -i 's/shrinkResources true/shrinkResources false/g' {} + 2>/dev/null || true
          
          # إجبار إعدادات الـ SDK المتوافقة
          find android -name "build.gradle" -type f -exec sed -i 's/compileSdk .*/compileSdk = 36/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -type f -exec sed -i 's/targetSdk .*/targetSdk = 35/g' {} + 2>/dev/null || true
          
          # بناء الـ APK بالحجم الكامل الأصلي
          flutter build apk --release --no-shrink  
            
      - name: Upload Clean APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: mirror-scorpion-release  
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
